version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: yarvo_postgres_prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: yarvo_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    restart: always

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: yarvo_api_prod
    ports:
      - "3002:3002"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/yarvo_db?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3002
    depends_on:
      - postgres
    restart: always

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://your_domain_or_ip:3002}
    container_name: yarvo_web_prod
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://your_domain_or_ip:3002}
      - PORT=3001
    depends_on:
      - api
    restart: always

  caddy:
    image: caddy:latest
    container_name: yarvo_caddy_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata_prod:
  caddy_data:
  caddy_config:
